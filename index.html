<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keha Bangbon</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #0a0f0a;
      color: #00e5ff;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0f0a;
      z-index: 10;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0,229,255,0.2);
      border-top: 4px solid #00e5ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div id="loading">
  <div class="spinner"></div>
</div>

<div id="app" class="p-6 hidden">
  <h1 class="text-xl mb-4">💰 Keha Bangbon</h1>

  <div class="mb-4">
    <div>คงเหลือ: <span id="remain">0</span></div>
    <div>ใช้ไป: <span id="total">0</span></div>
  </div>

  <div id="list"></div>

  <div class="mt-6">
    <input id="item" placeholder="รายการ" class="text-black p-2 w-full mb-2">
    <input id="amount" type="number" placeholder="จำนวนเงิน" class="text-black p-2 w-full mb-2">
    <button onclick="save()" class="bg-cyan-400 text-black px-4 py-2">บันทึก</button>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxhzmtvfOSsLx7x0vFOvAu5Tx1vEzAq52rFPrTAEmqNlDFiszJFxK6JRESqG2AfyErtog/exec";

// 🚀 โหลดข้อมูล
async function loadData() {
  try {
    const res = await fetch(API + "?api=1");
    const data = await res.json();
    render(data);
  } catch (e) {
    alert("โหลดข้อมูลไม่ได้");
  } finally {
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").classList.remove("hidden");
  }
}

// 🚀 แสดงผล
function render(data) {
  const list = document.getElementById("list");

  let total = 0;
  let html = "";

  data.expenses.forEach(e => {
    total += Number(e[2]);

    html += `
      <div style="border-bottom:1px solid #333;padding:8px 0">
        ${e[1]} - ฿${e[2]}
      </div>
    `;
  });

  const remain = (data.budget || 0) - total;

  document.getElementById("total").innerText = total;
  document.getElementById("remain").innerText = remain;
  list.innerHTML = html;
}

// 🚀 บันทึกข้อมูล (ยิง API กลับ GAS)
function save() {
  const item = document.getElementById("item").value;
  const amount = document.getElementById("amount").value;

  if (!item || !amount) return alert("กรอกข้อมูล");

  fetch(API, {
    method: "POST",
    body: JSON.stringify({ item, amount })
  })
  .then(() => loadData());
}

// 🚀 โหลดครั้งแรก
loadData();
</script>

</body>
</html>
