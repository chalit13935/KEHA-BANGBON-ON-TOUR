<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Keha Bangbon</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #0a0f0a;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>

<body>

  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxYLg1fEBwqbdMNeRM_TGFcMUZVlYxBEP1e7yJ0jMrDIbPhCdsTg5P5A3jF_BA9Ir5GiQ/exec">
  </iframe>

  <script>
    const frame = document.getElementById('appFrame');

    let isRefreshing = false;
    let isActive = true;

    // เช็คว่า user ยังอยู่หน้าไหม
    document.addEventListener('visibilitychange', () => {
      isActive = !document.hidden;
    });

    function reloadFrame() {
      if (isRefreshing) return;
      isRefreshing = true;

      const newFrame = document.createElement('iframe');
      newFrame.src = frame.src.split('?')[0] + '?t=' + Date.now();
      newFrame.style.position = 'absolute';
      newFrame.style.top = '0';
      newFrame.style.left = '0';
      newFrame.style.width = '100%';
      newFrame.style.height = '100%';
      newFrame.style.border = 'none';
      newFrame.style.opacity = '0';

      document.body.appendChild(newFrame);

      newFrame.onload = () => {
        newFrame.style.opacity = '1';

        // ลบ iframe เก่า
        document.body.removeChild(frame);

        // เปลี่ยน reference
        frame = newFrame;
        isRefreshing = false;
      };
    }

    // 🔥 รีทุก 10 วิ (อย่าเร็วกว่านี้)
    setInterval(() => {
      if (isActive) {
        reloadFrame();
      }
    }, 10000);

  </script>

</body>
</html>
