<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Keha Bangbon</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #0a0f0a;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      transition: opacity 0.25s ease;
    }
  </style>
</head>

<body>

  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzR2LqvHNqJdxAeazEUJeKBi_5ohzZ2qwQ1UEGRiPI7TTto3UlRy2eFBPQDOnRR6Uhmpw/exec">
  </iframe>

  <script>
    const frame = document.getElementById('appFrame');

    let isRefreshing = false;
    let isActive = true;

    // 🔥 เช็ค user ยังอยู่หน้าไหม
    document.addEventListener('visibilitychange', () => {
      isActive = !document.hidden;
    });

    function reloadFrameSmooth() {
      if (isRefreshing) return; // กันซ้อน
      isRefreshing = true;

      frame.style.opacity = 0.4;

      setTimeout(() => {
        const base = frame.src.split('?')[0];
        frame.src = base + '?t=' + Date.now(); // กัน cache
      }, 200);

      // รอโหลดเสร็จแล้วค่อย fade กลับ
      frame.onload = () => {
        frame.style.opacity = 1;
        isRefreshing = false;
      };
    }

    // 🔥 รีทุก 10 วิ (ลดกระพริบ)
    setInterval(() => {
      if (isActive) {
        reloadFrameSmooth();
      }
    }, 10000);

  </script>

</body>
</html>
